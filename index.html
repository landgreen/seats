<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Grid</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <nav class="period-menu" aria-label="Class controls">
    <div class="period-controls">
      <button id="previous-period" class="period-button" type="button" aria-label="Previous period">
        &larr;
      </button>
      <span id="period-label" class="period-label" aria-live="polite">Period 1</span>
      <button id="next-period" class="period-button" type="button" aria-label="Next period">
        &rarr;
      </button>
    </div>
    <div class="random-controls">
      <button id="undo-student-change" class="undo-button" type="button" aria-label="Undo last student change" title="Undo last student change" disabled>
        <svg height="21" viewBox="0 0 409 409" aria-hidden="true">
          <path fill="currentColor" d="M212.018,7.461c-60.921,0-118.198,28.518-155.245,75.784L0.122,50.491L0,237.986l162.426-93.645l-52.213-30.21c25.648-28.724,62.548-46.02,101.805-46.02c75.233,0,136.475,61.213,136.475,136.465c0,75.25-61.241,136.468-136.475,136.468v60.645c108.701,0,197.133-88.423,197.133-197.112C409.151,95.891,320.719,7.461,212.018,7.461z" />
        </svg>
      </button>
      <button id="randomized-student" class="randomized-button" type="button">
        random
      </button>
    </div>
    <details class="settings-menu">
      <summary>Settings</summary>
      <label class="settings-option">
        <input id="show-student-pictures" type="checkbox" checked />
        <span>photos</span>
      </label>
      <label class="settings-option">
        <input id="voice-enabled" type="checkbox" checked />
        <span>voice</span>
      </label>
      <label class="settings-option">
        <input id="show-called-on-count" type="checkbox" />
        <span>called on</span>
      </label>
      <button id="export-local-storage" class="settings-export-button" type="button">
        export JSON
      </button>
      <button id="import-local-storage" class="settings-export-button" type="button">
        import JSON
      </button>
      <input id="import-local-storage-file" type="file" accept=".json,application/json" hidden />
      <div class="settings-section">
        <div class="settings-section-title">Reports</div>
        <button id="download-student-report" class="settings-export-button" type="button">
          download text report
        </button>
      </div>
    </details>
  </nav>

  <main class="page">
    <div id="student-grid" class="student-grid"></div>
  </main>

  <script src="script.js"></script>
</body>

</html>
